version: 2.1

orbs:
  android: circleci/android@2.3.0

aliases:
  - &workspace_root /home/circleci/project

commands:
  install-build-tools:
    description: "Install build dependencies"
    steps:
      - run:
          name: "Install build dependencies"
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              gcc-aarch64-linux-gnu \
              arm-linux-gnueabi-gcc \
              make bc bison flex \
              libssl-dev libelf-dev \
              python3 ccache git \
              wget xz-utils zip unzip \
              file rsync lz4 zstd sudo

      - run:
          name: "Setup ccache"
          command: |
            ccache --set-config=max_size=2G
            ccache --set-config=compression=true
            ccache -z

jobs:
  build:
    resource_class: large
    docker:
      - image: cimg/base:stable
    environment:
      CLANG_DIR: "/root/clang"
      GCC64_DIR: "/root/gcc64/aarch64--glibc--stable-2025.08-1"
      GCC32_DIR: "/root/gcc32"
    steps:
      - checkout
      - install-build-tools
      - run:
          name: "Build Infinity Kernel (build.sh)"
          no_output_timeout: 60m
          command: |
            chmod +x build.sh

            # Build with KernelSU-Next (default)
            # Available: kernelsu, apatch, sukisu_ultra, resukisu, kowsu, none
            ./build.sh kernelsu 8

            if [ -f "out/"*.zip ]; then
              echo "BUILD SUCCESSFUL!"
              ls -lh out/*.zip
            else
              echo "BUILD FAILED!"
              tail -80 infinity_build.log
              exit 1
            fi

      - store_artifacts:
          path: out/
          destination: infinity-kernel-build

  build-test:
    resource_class: medium
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - install-build-tools
      - run:
          name: "Quick build test (compile only)"
          no_output_timeout: 45m
          command: |
            chmod +x build.sh
            # Test build without packaging - just compile
            ./build.sh kernelsu 4
            echo "BUILD TEST COMPLETE"

workflows:
  infinity-kernel-ci:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
            tags:
              only: /^v.*/
      - build-test:
          filters:
            branches:
              ignore:
                - main
