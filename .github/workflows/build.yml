name: Build Infinity Kernel

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      root_mode:
        description: 'Root manager'
        required: true
        default: 'kernelsu'
        type: choice
        options:
          - kernelsu
          - apatch
          - sukisu_ultra
          - resukisu
          - kowsu
          - none
      jobs:
        description: 'Build jobs (parallel)'
        required: false
        default: '8'

jobs:
  build:
    name: Build (${{ github.event.inputs.root_mode || 'kernelsu' }})
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    env:
      ROOT_MODE: ${{ github.event.inputs.root_mode || 'kernelsu' }}
      BUILD_JOBS: ${{ github.event.inputs.jobs || '8' }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
            gcc-aarch64-linux-gnu arm-linux-gnueabi-gcc \
            make bc bison flex libssl-dev libelf-dev \
            python3 ccache git wget xz-utils zip \
            file rsync lz4 zstd sudo

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-infinity-${{ github.sha }}
          restore-keys: ccache-infinity-

      - name: Build kernel
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache --set-config=max_size=2G
          ccache -z
          chmod +x build.sh
          ./build.sh $ROOT_MODE $BUILD_JOBS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfinityKernel-${{ env.ROOT_MODE }}
          path: out/*.zip
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          if ls out/*.zip 1>/dev/null 2>&1; then
            echo "✅ **SUCCESS**" >> $GITHUB_STEP_SUMMARY
            ls -lh out/*.zip >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED**" >> $GITHUB_STEP_SUMMARY
            tail -40 infinity_build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi
