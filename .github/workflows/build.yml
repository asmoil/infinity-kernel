# Infinity Kernel CI
# SPDX-License-Identifier: GPL-2.0-only

name: Build Infinity Kernel

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      root_type:
        description: 'Root type'
        required: false
        default: 'kernelsu'
        type: choice
        options:
          - kernelsu
          - apatch
          - none
      variant:
        description: 'Variant'
        required: false
        default: 'miui'
        type: choice
        options:
          - miui
          - hyperos
          - aosp

jobs:
  build:
    name: ${{ matrix.root }}-${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - root: kernelsu
            variant: miui
          - root: kernelsu
            variant: hyperos
          - root: apatch
            variant: miui
          - root: none
            variant: aosp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            zstd libncurses5 libncursesw5 python3 python3-pip \
            zip unzip rsync curl git file wget ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.root }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: ${{ matrix.root }}-${{ matrix.variant }}-
          max-size: 2G

      - name: Download Neutron Clang
        run: |
          mkdir -p toolchain
          curl -sL "https://github.com/NeutronClangToolchain/clang-build/releases/download/20250430/clang-build-20250430.tar.zst" \
            -o /tmp/tc.tar.zst
          zstd -d /tmp/tc.tar.zst -o /tmp/tc.tar
          tar xf /tmp/tc.tar -C toolchain --strip-components=1
          rm -f /tmp/tc.tar /tmp/tc.tar.zst
          echo "TOOLCHAIN_BIN=$(pwd)/toolchain/bin" >> $GITHUB_ENV

      - name: Build kernel
        env:
          CCACHE_DIR: ${{ github.workspace }}/ccache
          PATH: ${{ env.TOOLCHAIN_BIN }}:${{ github.env.PATH }}
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.root }} ${{ matrix.variant }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfinityKernel-${{ matrix.root }}-${{ matrix.variant }}
          path: out/*.zip
          retention-days: 14
